<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Jardim Planner</title>
<meta name="theme-color" content="#4f8a5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jardim">
<style>
:root{--bg:#f6f4ee;--card:#fff;--txt:#2d2a26;--mut:#7a746b;--pri:#4f8a5b;--pri2:#e7f1e8;--bd:#e4dfd4;--red:#c0564b;--gold:#c99a1a;--blu:#3d8fc9}
@media (prefers-color-scheme:dark){:root{--bg:#1d1f1c;--card:#272a26;--txt:#ecebe6;--mut:#a7a49b;--pri:#7cbf88;--pri2:#2f3a30;--bd:#3a3d38;--red:#e07b70;--gold:#f0c341;--blu:#7cc0f0}}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;padding-top:max(12px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:20px;margin:0}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:none;border:1px solid var(--bd);color:var(--txt);padding:7px 12px;border-radius:20px;cursor:pointer;font-size:14px;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button.b{background:var(--pri);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
button.g{background:none;color:var(--txt);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}
button.d{background:none;color:var(--red);border:1px solid var(--red);border-radius:8px;padding:7px 12px;cursor:pointer}
button.sm{padding:3px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--txt)}
label{font-size:13px;color:var(--mut);display:block;margin:8px 0 3px}
h4{margin:14px 0 4px}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--pri2)}
.p3{background:#f6d6d2;color:#8a2c22}.p2{background:#f7e8c6;color:#7a5410}.p1{background:#dde9f5;color:#2b4f75}
.tr{background:#dceefa;color:#1f5f8a}.tl{background:#fbefc4;color:#7a5a00}
.task{border-left:5px solid var(--pri)}
.task h3{margin:0;font-size:16px}
.done h3,.sub.done span:first-child{text-decoration:line-through;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
.chk{margin:6px 0 0 4px;font-size:14px;color:var(--txt)}
.subs{margin-top:8px;border-top:1px dashed var(--bd);padding-top:6px}
.sub{padding:3px 0 3px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px;z-index:30}
.modal.on{display:flex}
.box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:600px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ckrow{display:flex;gap:6px;align-items:center;margin:4px 0}
.ckrow input[type=text]{flex:1;min-width:0}
.ckrow.ok input[type=text]{text-decoration:line-through;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .c{background:var(--card);border:1px solid var(--bd);border-radius:8px;min-height:86px;padding:4px;font-size:12px;overflow:hidden}
.cal .c.out{opacity:.4}.cal .c.today{border:2px solid var(--pri)}
.cal .ev{border-radius:5px;padding:1px 4px;margin-top:2px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wcol{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;min-height:200px}
.wcol.today{border:2px solid var(--pri)}
.wk{background:var(--bg);border-radius:6px;padding:5px 6px;margin-top:5px;font-size:13px;cursor:grab;touch-action:none;user-select:none;overflow-wrap:anywhere}
.wk.dn{opacity:.5;text-decoration:line-through}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:60px}
.tray .wk{width:180px}
.mx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx .card{min-height:150px}
.ghost{position:fixed;pointer-events:none;transform:translate(-50%,-85%);z-index:50}
.gwrap{overflow:hidden;border-radius:14px;background:linear-gradient(#cfe7f5,#eaf4ea)}
.gfield{position:relative;transform-origin:top left}
.pl{position:absolute;font-size:36px;transform:translate(-50%,-88%);cursor:grab;touch-action:none;user-select:none;line-height:1}
.pl.L{font-size:46px}
.inv{display:flex;flex-wrap:wrap;gap:8px}
.invp{font-size:32px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;cursor:grab;touch-action:none;user-select:none;position:relative}
.invp small{position:absolute;right:3px;bottom:1px;font-size:11px;color:var(--mut)}
.big{font-size:18px;padding:14px 22px!important;border-radius:12px!important}
.qc{display:flex;gap:6px;margin-top:10px}
.qc input{flex:1;min-width:0;font-size:15px;padding:10px 12px}
.rv{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 0;border-bottom:1px solid var(--bd)}
.rv:last-child{border-bottom:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw;font-size:14px;box-shadow:0 4px 14px #0004}
#toast.on{display:block}
/* itens e raridades */
.it{display:inline-block;position:relative;line-height:1}
.it svg{width:1em;height:1em;display:block}
.t-c{filter:drop-shadow(0 3px 2px #0004)}
.t-r{filter:drop-shadow(0 0 4px rgba(90,190,255,.95)) drop-shadow(0 3px 2px #0003)}
.t-r::after{content:'✨';position:absolute;font-size:.42em;right:-.3em;top:-.25em;animation:tw 1.8s ease-in-out infinite}
.t-l{filter:drop-shadow(0 0 5px #ffd54a) drop-shadow(0 0 12px rgba(255,180,0,.75));animation:fl 3s ease-in-out infinite}
.t-l::before{content:'';position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(rgba(255,232,130,.75),rgba(255,232,130,0) 65%);z-index:-1;animation:au 2.4s ease-in-out infinite}
.t-l::after{content:'✦';position:absolute;font-size:.35em;color:#ffcf33;left:-.3em;top:-.1em;animation:tw 1.3s ease-in-out infinite .4s}
.it.x::after{content:'❄';color:#9fd6ff}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes au{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){.t-r::after,.t-l,.t-l::before,.t-l::after{animation:none}}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.cell{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px}
.cell .it{font-size:34px;margin:6px 0}
.cell.lock .it{filter:grayscale(1) brightness(0);opacity:.25;animation:none}
.cell.lock .it::before,.cell.lock .it::after{display:none}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}
.bars div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px}
#timer{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;padding:20px;overflow:auto}
#timer.on{display:flex}
#tPlant{font-size:60px;transition:transform 1s}
#tClock{font-size:64px;font-weight:600;font-variant-numeric:tabular-nums;margin:10px 0}
#tCk{width:100%;max-width:420px;text-align:left;margin-top:16px}
#tCk .tci{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-top:6px;cursor:pointer;font-size:15px}
#tCk .tci.ok span{text-decoration:line-through;color:var(--mut)}
#tCk input[type=checkbox]{width:18px;height:18px}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.prog>div{height:100%;background:var(--pri);transition:width .3s}
.prog.over>div{background:var(--red)}
.field{border:1px dashed var(--bd);border-radius:8px;padding:8px;margin:6px 0}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi .card{margin:0}.kpi b{font-size:20px;display:block;margin-top:2px}
.in{color:var(--pri)}.outc{color:var(--red)}
.tx{display:flex;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.tx:last-child{border-bottom:none}
.tx.pend .ds{font-style:italic}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:20px;overflow:hidden}
.seg button{border:none;background:none;color:var(--txt);padding:6px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--pri);color:#fff}
@media (max-width:760px){.week{grid-template-columns:1fr}.wcol{min-height:0}.mx{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}
  header{padding:8px 10px}header h1{font-size:17px}nav{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;scrollbar-width:none}main{padding:10px}}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.cal .c{min-height:60px;font-size:11px}.cal .ev{padding:1px 2px}}
</style>
</head>
<body>
<header>
  <h1>🌱 Meu Jardim Planner <span class="mut">v5</span></h1>
  <nav id="nav">
    <button data-v="today" class="on" type="button">☀️ Hoje</button>
    <button data-v="tasks" type="button">📋 Tarefas</button>
    <button data-v="week" type="button">🗓️ Semana</button>
    <button data-v="cal" type="button">📅 Calendário</button>
    <button data-v="fin" type="button">💰 Finanças</button>
    <button data-v="garden" type="button">🌳 Jardim</button>
    <button data-v="areas" type="button">🗂️ Áreas</button>
    <button data-v="settings" type="button">⚙️ Ajustes</button>
  </nav>
</header>
<main id="main"></main>

<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="timer">
  <div class="mut" id="tArea"></div>
  <h2 id="tTitle" style="margin:4px 0"></h2>
  <div id="tPlant">🌱</div>
  <div id="tClock">00:00</div>
  <div id="tTier" class="mut" style="margin-bottom:10px"></div>
  <div class="row" style="justify-content:center">
    <button class="g" id="tPause" type="button">⏸ Pausar</button>
    <button class="b" id="tFinish" type="button">✅ Concluí</button>
    <button class="g" id="tCancel" type="button">✖ Cancelar</button>
  </div>
  <div id="tEnd" style="display:none;margin-top:18px">
    <p id="tEndMsg"></p>
    <div class="row" style="justify-content:center">
      <button class="b" id="tCont" type="button"></button>
      <button class="b" id="tDone" type="button">✅ Foi suficiente, concluí</button>
      <button class="g" data-more="5" type="button">+5 min</button>
      <button class="g" data-more="15" type="button">+15 min</button>
      <button class="g" id="tMoreC" type="button">+ outro tempo</button>
      <button class="g" id="tStop" type="button">⏹ Parar por aqui</button>
    </div>
  </div>
  <div id="tCk" aria-live="polite"></div>
</div>

<script>
(()=>{
const KEY='jardimPlanner.v1'; // mesma chave das versões anteriores: seus dados são mantidos
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const now=()=>Date.now();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayS=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtMin=m=>{m=Math.round(m||0);return m>=60?`${Math.floor(m/60)}h${m%60?p2(m%60):''}`:`${m} min`};
const fmtDate=(d,t)=>{if(!d)return'';const[y,m,dd]=d.split('-');return `${dd}/${m}/${y}${t?' '+t:''}`};
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
let finShow=false; // valores financeiros começam ocultos
const money=v=>finShow?BRL.format(v||0):'R$ •••••';
let toastT=null;
function toast(msg,ms=3500){const t=$('#toast');t.innerHTML=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),ms);}

/* ================= BASE DE DADOS DE RECOMPENSAS ================= */
const SVG={
 cerca:'<svg viewBox="0 0 40 40"><g fill="#c8935a" stroke="#7a4f28" stroke-width="1.2"><path d="M5 34V12l3-4 3 4v22z"/><path d="M17 34V12l3-4 3 4v22z"/><path d="M29 34V12l3-4 3 4v22z"/><rect x="2" y="16" width="36" height="4" rx="1"/><rect x="2" y="26" width="36" height="4" rx="1"/></g></svg>',
 banco:'<svg viewBox="0 0 40 40"><g stroke="#5b3a1e" stroke-width="1.2"><rect x="4" y="10" width="32" height="4" rx="1" fill="#b77b45"/><rect x="4" y="16" width="32" height="4" rx="1" fill="#b77b45"/><rect x="2" y="23" width="36" height="4" rx="1" fill="#c8935a"/></g><g fill="#3d3d3d"><rect x="6" y="20" width="3" height="16"/><rect x="31" y="20" width="3" height="16"/><rect x="6" y="9" width="3" height="11"/><rect x="31" y="9" width="3" height="11"/></g></svg>',
 balanco:'<svg viewBox="0 0 40 40"><g stroke="#7a4f28" stroke-width="3" stroke-linecap="round" fill="none"><path d="M4 38L12 4M36 38L28 4M10 4h20"/></g><g stroke="#8a8a8a" stroke-width="1.2"><path d="M15 5v24M25 5v24"/></g><rect x="12" y="28" width="16" height="4" rx="1.5" fill="#e0574a"/></svg>',
 poste:'<svg viewBox="0 0 40 40"><circle cx="20" cy="9" r="9" fill="#ffe68a" opacity=".55"/><rect x="18.5" y="12" width="3" height="25" fill="#3b4048"/><rect x="14" y="35" width="12" height="3" rx="1" fill="#3b4048"/><path d="M14 13h12l-2-7h-8z" fill="#3b4048"/><rect x="16" y="7" width="8" height="5" fill="#ffd84a"/><path d="M15 6h10l-5-4z" fill="#3b4048"/></svg>',
 poco:'<svg viewBox="0 0 40 40"><path d="M4 14L20 4l16 10z" fill="#b0453b"/><rect x="8" y="14" width="3" height="12" fill="#7a4f28"/><rect x="29" y="14" width="3" height="12" fill="#7a4f28"/><path d="M20 15v8" stroke="#666" stroke-width="1"/><rect x="18" y="21" width="4" height="4" fill="#8a6a3a"/><rect x="6" y="25" width="28" height="12" rx="2" fill="#9aa0a6"/><path d="M6 29h28M6 33h28M13 25v4M24 29v4M16 33v4M28 25v4" stroke="#6c7278" stroke-width="1"/><ellipse cx="20" cy="25.5" rx="12" ry="2" fill="#2f6fa5"/></svg>',
 ponte:'<svg viewBox="0 0 40 40"><path d="M2 30Q20 10 38 30v4H2z" fill="#c8935a" stroke="#7a4f28" stroke-width="1.2"/><path d="M8 34Q20 22 32 34" fill="#6ec1e4"/><g stroke="#7a4f28" stroke-width="2"><path d="M4 26V18M12 20v-7M20 18v-7M28 20v-7M36 26v-8"/><path d="M4 18Q20 6 36 18" fill="none"/></g></svg>',
 bengala:'<svg viewBox="0 0 40 40"><path d="M24 38V12a7 7 0 0 0-14 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M24 38V12a7 7 0 0 0-14 0" fill="none" stroke="#e03131" stroke-width="6" stroke-linecap="round" stroke-dasharray="3.5 3.5"/></svg>',
 pisca:'<svg viewBox="0 0 40 40"><path d="M2 12Q20 30 38 12" fill="none" stroke="#2f6b3a" stroke-width="1.5"/><g><circle cx="7" cy="17" r="3" fill="#ff4d4d"/><circle cx="14" cy="21.5" r="3" fill="#ffd43b"/><circle cx="20" cy="23" r="3" fill="#4dabf7"/><circle cx="26" cy="21.5" r="3" fill="#69db7c"/><circle cx="33" cy="17" r="3" fill="#f783ac"/></g></svg>',
 guirlanda:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="13" fill="none" stroke="#2b8a3e" stroke-width="8"/><circle cx="20" cy="20" r="13" fill="none" stroke="#51cf66" stroke-width="3" stroke-dasharray="2 4"/><g fill="#e03131"><circle cx="11" cy="14" r="2"/><circle cx="29" cy="15" r="2"/><circle cx="27" cy="29" r="2"/><circle cx="12" cy="27" r="2"/></g><path d="M20 7l-6-4v8zM20 7l6-4v8z" fill="#e03131"/><circle cx="20" cy="7" r="2" fill="#c92a2a"/></svg>',
 coreto:'<svg viewBox="0 0 40 40"><path d="M20 2l17 11H3z" fill="#e8f4ff" stroke="#8aa6c1" stroke-width="1"/><path d="M20 2v-1" stroke="#c99a1a" stroke-width="2"/><circle cx="20" cy="2" r="1.6" fill="#f0c341"/><path d="M3 13h34" stroke="#c99a1a" stroke-width="1.6"/><g fill="#fff" stroke="#8aa6c1" stroke-width=".8"><rect x="5" y="14" width="2.6" height="18"/><rect x="13.5" y="14" width="2.6" height="18"/><rect x="23.9" y="14" width="2.6" height="18"/><rect x="32.4" y="14" width="2.6" height="18"/></g><path d="M5 22h30" stroke="#8aa6c1" stroke-width="1" stroke-dasharray="1.5 1.5"/><g fill="#f783ac"><circle cx="9" cy="15" r="1.5"/><circle cx="20" cy="15" r="1.5"/><circle cx="31" cy="15" r="1.5"/></g><g fill="#51cf66"><circle cx="7" cy="16" r="1.3"/><circle cx="33" cy="16" r="1.3"/><circle cx="16" cy="16" r="1.2"/><circle cx="24" cy="16" r="1.2"/></g><path d="M2 32h36l-2 6H4z" fill="#c9ccd1" stroke="#8a8f96" stroke-width="1"/></svg>',
 chafariz:'<svg viewBox="0 0 40 40"><path d="M20 4c-3 3-3 7 0 9 3-2 3-6 0-9z" fill="#74c0fc"/><path d="M20 12c-6 0-10 2-12 6M20 12c6 0 10 2 12 6" stroke="#74c0fc" stroke-width="1.6" fill="none"/><rect x="18" y="12" width="4" height="12" fill="#f0c341" stroke="#a07c10" stroke-width=".8"/><ellipse cx="20" cy="18" rx="9" ry="2.6" fill="#4dabf7" stroke="#a07c10" stroke-width="1"/><path d="M3 28c0-3 34-3 34 0v6c0 3-34 3-34 0z" fill="#e9ecef" stroke="#a07c10" stroke-width="1"/><ellipse cx="20" cy="28" rx="16.5" ry="3" fill="#4dabf7"/><path d="M8 28c2-1 4 1 6 0s4 1 6 0 4 1 6 0 4 1 6 0" stroke="#d0ebff" stroke-width=".9" fill="none"/><g fill="#f0c341"><circle cx="8" cy="32.5" r="1"/><circle cx="20" cy="34" r="1"/><circle cx="32" cy="32.5" r="1"/></g></svg>'
};
const DB=[];

function makeDrag(e,ghostHTML,onDrop,onClick){
  if(e.button>0)return;
  const sx=e.clientX,sy=e.clientY;let g=null;
  const mv=ev=>{if(!g){if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;g=document.createElement('div');g.className='ghost';g.innerHTML=ghostHTML;document.body.appendChild(g);}
    g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';ev.preventDefault();};
  const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    if(g){g.remove();if(ev.type==='pointerup')onDrop(ev.clientX,ev.clientY);}else if(onClick&&ev.type==='pointerup')onClick();};
  document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}

/* ---------- O QUE FAÇO AGORA ---------- */
function pickSuggestion(free,skip){
  const td=todayS(),soon=addDays(td,2),lim=addDays(td,14);
  return tasks().filter(t=>t.status==='todo'&&!skip.includes(t.id)&&!kids(t).some(k=>k.status==='todo')
      &&!(t.time&&t.date&&t.date>=td)&&!(t.date&&t.date>lim)&&t.estimate<=free)
   .map(t=>{let s=t.priority*20;const why=[];
     if(t.date&&t.date<td){s+=100;why.push('⚠️ atrasada')}else if(t.date===td){s+=70;why.push('📌 é para hoje')}else if(t.date&&t.date<=soon){s+=40;why.push('⏳ vence em breve')}
     if(t.priority===3)why.push('⭐ prioridade alta');
     if(t.estimate<=15){s+=5;why.push('⚡ rápida')}
     why.push('✅ cabe no seu tempo');return{t,s,why};})
   .sort((a,b)=>b.s-a.s)[0];
}
function suggestFlow(){
  $('#mbox').innerHTML=`<h2 style="margin-top:0">✨ O que faço agora?</h2><p>Quanto tempo você tem agora?</p>
   <div class="row">${[15,30,60,120].map(m=>`<button class="g" data-free="${m}" type="button">${m<60?m+' min':m/60+' h'}</button>`).join('')}<button class="g" data-free="9999" type="button">Sem limite</button></div>
   <div id="sg" aria-live="polite"></div><div class="row" style="margin-top:12px"><span class="sp"></span><button class="g" id="cx" type="button">Fechar</button></div>`;
  openModal();let free=0,skip=[];
  const show=()=>{let s=pickSuggestion(free,skip);
    if(!s&&skip.length){skip=[];s=pickSuggestion(free,skip);}
    if(!s){$('#sg').innerHTML='<p class="mut">Nenhuma tarefa pendente cabe nesse tempo. Aproveite para descansar 🌿 ou crie uma tarefa nova.</p>';return;}
    const a=area(s.t.areaId),par=parentOf(s.t);
    $('#sg').innerHTML=`<div class="card task" style="border-left-color:${a.color};margin-top:12px">${par?`<div class="mut">↳ parte de: ${esc(par.title)}</div>`:''}<h3>${a.emoji} ${esc(s.t.title)}</h3>
      <div class="mut">⏱ ${s.t.estimate} min · ${s.why.join(' · ')}</div><div style="margin-top:6px">${rewardTag(s.t.estimate)}</div>
      <div class="row" style="margin-top:10px"><button class="b" id="goT" type="button">▶ Começar agora</button>${s.t.estimate>5?'<button class="g" id="goF" type="button">⚡ Só 5 minutos</button>':''}<button class="g" id="other" type="button">🔄 Outra sugestão</button></div></div>`;
    $('#goT').onclick=()=>{closeModal();startTimer(s.t)};if($('#goF'))$('#goF').onclick=()=>{closeModal();startTimer(s.t,true)};$('#other').onclick=()=>{skip.push(s.t.id);show()};};
  document.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{free=+b.dataset.free;skip=[];
    document.querySelectorAll('[data-free]').forEach(x=>x.className=x===b?'b':'g');show();});
  $('#cx').onclick=closeModal;
}

/* ---------- REVISÃO SEMANAL ---------- */
function reviewFlow(){
  const key=reviewKey(),already=S.reviews.includes(key);
  const draw=()=>{
    const td=todayS(),wkStart=addDays(td,-7);
    const doneW=tasks().filter(t=>t.status==='done'&&t.doneAt&&ymd(new Date(t.doneAt))>wkStart);
    const plW=S.plants.filter(p=>ymd(new Date(p.earnedAt))>wkStart);
    const pend=tasks().filter(t=>t.status==='todo');
    const late=pend.filter(t=>!t.inbox&&t.date&&t.date<td);
    const inbox=pend.filter(t=>t.inbox);
    const days=[...Array(7)].map((_,i)=>addDays(key,i)),dn=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
    const row=t=>{const a=area(t.areaId);return `<div class="rv"><span>${t.inbox?'📥':a.emoji} ${esc(t.title)}</span>${t.date?`<span class="mut">${fmtDate(t.date)}</span>`:''}<span class="sp"></span>
      <button class="g sm" type="button" data-rv="week" data-id="${t.id}">📆 Semana de ${fmtDate(key).slice(0,5)}</button>
      <button class="g sm" type="button" data-rv="nodate" data-id="${t.id}">Sem data</button>
      <button class="g sm" type="button" data-rv="done" data-id="${t.id}">✓ Já fiz</button>
      <button class="g sm" type="button" data-rv="del" data-id="${t.id}" aria-label="Excluir">🗑️</button></div>`;};
    $('#mbox').innerHTML=`<h2 style="margin-top:0">🧭 Revisão semanal</h2>
    <h4>1. ✅ Sua semana</h4><p style="margin:4px 0">Você concluiu <b>${doneW.length}</b> tarefa(s), ganhou <b>${plW.length}</b> recompensa(s) e dedicou <b>${fmtMin(plW.reduce((s,p)=>s+(p.minutes||0),0))}</b>. ${plW.slice(-12).map(p=>itemHTML(itemOf(p))).join(' ')}</p>
    <h4>2. ⚠️ Atrasadas (${late.length})</h4><div class="mut">Decida o destino de cada uma: replanejar, tirar a data, marcar como feita ou excluir.</div>${late.map(row).join('')||'<p class="mut">Nenhuma atrasada 🎉</p>'}
    <h4>3. 📥 Caixa de entrada (${inbox.length})</h4><div class="mut">Planeje para a semana ou exclua. Para definir área e detalhes, use 🗂️ Organizar na tela Hoje.</div>${inbox.map(row).join('')||'<p class="mut">Caixa vazia ✨</p>'}
    <h4>4. 🗓️ Semana de ${fmtDate(key).slice(0,5)}</h4>
    <div class="week" style="grid-template-columns:repeat(7,minmax(0,1fr))">${days.map((d,i)=>{const ts=pend.filter(t=>t.date===d);return `<div class="cell"><b>${dn[i]}</b><div>${d.slice(8)}/${d.slice(5,7)}</div><div class="mut">${ts.length} tarefa(s)</div><div class="mut">${ts.length?fmtMin(ts.reduce((s,t)=>s+t.estimate,0)):'livre'}</div></div>`}).join('')}</div>
    <p class="mut">Dica: para distribuir as tarefas pelos dias, use a aba 🗓️ Semana e arraste.</p>
    <div class="row" style="margin-top:12px"><button class="g" id="cx" type="button">Fechar</button><span class="sp"></span><button class="b" id="rvOk" type="button">🎁 Concluir revisão</button></div>
    ${already?'<p class="mut" style="text-align:right">A recompensa desta semana já foi recebida.</p>':''}`;
    $('#cx').onclick=()=>{closeModal();render();};
    $('#rvOk').onclick=()=>{
      if(already){closeModal();render();toast('🧭 Revisão concluída!');return;}
      S.reviews.push(key);const item=drawItem('r');
      S.plants.push({id:uid(),itemId:item.id,emoji:item.e.startsWith('@')?'🌱':item.e,tier:'r',taskId:null,taskTitle:'Revisão semanal',areaId:null,minutes:0,earnedAt:now(),updatedAt:now(),pos:null});
      save();showReward(item,'r','Revisão semanal concluída 🧭','Semana planejada, cabeça mais leve.');};
  };
  $('#mbox').onclick=e=>{const b=e.target.closest('[data-rv]');if(!b)return;const t=S.tasks.find(x=>x.id===b.dataset.id);
    if(b.dataset.rv==='week'){t.date=key;t.inbox=false;}
    if(b.dataset.rv==='nodate'){t.date='';t.inCalendar=false;}
    if(b.dataset.rv==='del'){if(!confirm('Excluir esta tarefa?'))return;t.deleted=true;}
    if(b.dataset.rv==='done'){const g=grantReward(t,t.estimate,false);toast(`${itemHTML(g.item)} +1 recompensa: ${esc(g.item.n)}`);}
    touch(t);save();draw();};
  openModal();draw();
}

/* ---------- TAREFAS ---------- */
function rTasks(){
  const td=todayS();
  const top=t=>!t.parentId||!parentOf(t);
  let list=tasks().filter(t=>top(t)&&(!filt.area||t.areaId===filt.area)&&(filt.status==='all'||t.status===filt.status));
  list.sort((a,b)=>(a.status===b.status?0:a.status==='todo'?-1:1)||(!!b.inbox-!!a.inbox)||(b.priority-a.priority)||((a.date||'9999').localeCompare(b.date||'9999')));
  const pend=tasks().filter(t=>t.status==='todo');
  const head=`<div class="card row"><b>${pend.length}</b> pendentes · <b>${pend.filter(t=>t.date===td).length}</b> para hoje · <b style="color:var(--red)">${pend.filter(t=>t.date&&t.date<td).length}</b> atrasadas · 🌱 <b>${S.plants.length}</b> itens no jardim
    <span class="sp"></span><button class="b" data-a="new" type="button">+ Nova tarefa</button></div>
  <div class="row" style="margin-bottom:10px">
    <select id="fM"><option value="list">Lista</option><option value="matrix">Matriz de prioridades</option></select>
    <select id="fA"><option value="">Todas as áreas</option>${areas().map(a=>`<option value="${a.id}" ${filt.area===a.id?'selected':''}>${a.emoji} ${esc(a.name)}</option>`).join('')}</select>
    ${filt.mode==='list'?'<select id="fS"><option value="todo">A fazer</option><option value="done">Concluídas</option><option value="all">Todas</option></select>':''}
  </div>`;
  let body;
  if(filt.mode==='list'){body=list.length?list.map(t=>taskCard(t)).join(''):'<div class="card mut">Nenhuma tarefa aqui. Que tal criar uma? 🌱</div>';}
  else{
    const soon=addDays(td,2),ps=pend.filter(t=>!t.inbox&&(!filt.area||t.areaId===filt.area));
    const urg=t=>t.date&&t.date<=soon,imp=t=>t.priority===3;
    const q=(title,desc,l,col)=>`<div class="card" style="border-top:4px solid ${col}"><b>${title}</b><div class="mut">${desc}</div>${l.map(t=>{const a=area(t.areaId);return `<div class="wk" data-a="edit" data-id="${t.id}" style="border-left:4px solid ${a.color};cursor:pointer">${a.emoji} ${esc(t.title)} <span class="mut">· ⏱ ${t.estimate} min${t.date?' · '+fmtDate(t.date):''}</span></div>`}).join('')||'<div class="mut" style="margin-top:6px">—</div>'}</div>`;
    body=`<p class="mut">Importante = prioridade Alta · Urgente = atrasada ou com prazo em até 2 dias</p><div class="mx">
      ${q('🔥 Fazer agora','Importante e urgente',ps.filter(t=>imp(t)&&urg(t)),'#c0564b')}
      ${q('📆 Planejar','Importante, sem urgência',ps.filter(t=>imp(t)&&!urg(t)),'#3d6fa8')}
      ${q('⚡ Resolver rápido','Urgente, menos importante',ps.filter(t=>!imp(t)&&urg(t)),'#d9a441')}
      ${q('🌿 Depois','Nem urgente nem importante',ps.filter(t=>!imp(t)&&!urg(t)),'#7a746b')}</div>`;
  }
  $('#main').innerHTML=head+body;
  $('#fM').value=filt.mode;$('#fM').onchange=e=>{filt.mode=e.target.value;render()};
  $('#fA').onchange=e=>{filt.area=e.target.value;render()};
  if($('#fS')){$('#fS').value=filt.status;$('#fS').onchange=e=>{filt.status=e.target.value;render()};}
}

/* ---------- EDITAR TAREFA ---------- */
function fieldInput(f,v){
  const n=`p_${f.id}`;
  if(f.type==='select')return `<select name="${n}" style="width:100%"><option value=""></option>${f.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if(f.type==='checkbox')return `<input type="checkbox" name="${n}" ${v?'checked':''}>`;
  return `<input name="${n}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" value="${esc(v??'')}" style="width:100%">`;
}

    $('#ckBox').innerHTML=t.checklist.map((i,k)=>`<div class="ckrow ${i.done?'ok':''}"><input type="checkbox" data-ci="${k}" ${i.done?'checked':''} aria-label="Marcar item">

      `<div class="ckrow"><span style="width:18px;text-align:center">＋</span><input type="text" id="ckNew" placeholder="Adicionar item e tecle Enter"></div>`;
  };

    const a=area(t.areaId),r=t.recur;
    $('#mbox').onclick=null;
    $('#mbox').innerHTML=`<form id="tf"><h2 style="margin-top:0">${wasInbox?'🗂️ Organizar anotação':isNew?(par?'Nova subtarefa':'Nova tarefa'):'Editar tarefa'}</h2>
    ${wasInbox?'<p class="mut">Defina a área, o tempo e, se quiser, a data. Ao salvar, sai da caixa de entrada.</p>':''}
    ${par?`<p class="mut">↳ Subtarefa de: <b>${esc(par.title)}</b> (ganha sua própria recompensa 🌱)</p>`:''}
    <label>Título</label><input name="title" required value="${esc(t.title)}" style="width:100%">

     <div><label>Área</label><select name="areaId" id="selA" style="width:100%">${areas().map(x=>`<option value="${x.id}" ${x.id===t.areaId?'selected':''}>${x.emoji} ${esc(x.name)}</option>`).join('')}</select></div>
     <div><label>Prioridade</label><select name="priority" style="width:100%">${[3,2,1].map(p=>`<option value="${p}" ${+t.priority===p?'selected':''}>${prioName[p]}</option>`).join('')}</select></div>

     <div><label>Data (opcional)</label><input name="date" type="date" value="${t.date}" style="width:100%"></div>
     <div><label>Horário (opcional)</label><input name="time" type="time" value="${t.time}" style="width:100%"></div>

    </div>

      ${r.type==='everyX'?`<div><label>A cada quantos dias?</label><input name="rn" type="number" min="1" max="365" value="${r.n||2}" style="width:100%"></div>`:''}</div>
      ${r.type==='weekdays'?`<div class="row" style="margin-top:6px">${[1,2,3,4,5,6,0].map(d=>`<label style="color:var(--txt);margin:0"><input type="checkbox" name="rd" value="${d}" ${(r.days||[]).includes(d)?'checked':''}> ${WD[d]}</label>`).join('')}</div>`:''}`}
    ${(a.fields||[]).length?`<h4>${a.emoji} Propriedades de ${esc(a.name)}</h4><div class="grid2">${a.fields.map(f=>`<div><label>${esc(f.label)}</label>${fieldInput(f,t.props[f.id])}</div>`).join('')}</div>`:''}
    <h4>Checklist</h4><div id="ckBox"></div>

    if(fd.get('rtype')){t.recur.type=fd.get('rtype');if(fd.get('rn'))t.recur.n=Math.min(365,Math.max(1,parseInt(fd.get('rn'))||2));

function openModal(){$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#mbox').onclick=null;$('#mbox').oninput=null;}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){closeModal();if(view==='today')render();}});

/* ---------- RECORRÊNCIA ---------- */
function nextDate(t){
  const r=t.recur,td=todayS(),base=t.date&&t.date>td?t.date:td;
  if(r.type==='daily')return addDays(base,1);
  if(r.type==='weekly')return addDays(base,7);
  if(r.type==='everyX')return addDays(base,Math.max(1,r.n||1));
  if(r.type==='monthly'){const day=parseD(t.date||base).getDate(),b=parseD(base),y=b.getFullYear(),m=b.getMonth()+1;
    return ymd(new Date(y,m,Math.min(day,new Date(y,m+1,0).getDate())));}
  if(r.type==='weekdays'){for(let i=1;i<=7;i++){const s=addDays(base,i);if(r.days.includes(parseD(s).getDay()))return s;}}
  return null;
}
function spawnNext(t){
  if(t.parentId||!t.recur||t.recur.type==='none')return null;
  const nd=nextDate(t);if(!nd)return null;
  const series=t.seriesId||t.id,id=series+'@'+nd;
  if(S.tasks.some(x=>x.id===id))return nd;
  S.tasks.push(touch({...JSON.parse(JSON.stringify(t)),id,seriesId:series,date:nd,status:'todo',spent:0,doneAt:null,deleted:false,
    checklist:t.checklist.map(i=>({id:uid(),text:i.text,done:false}))}));
  return nd;
}

/* ---------- NOTIFICAÇÕES / LEMBRETES ---------- */
async function notify(title,body,tag){
  const can=S.settings.notify&&'Notification' in window&&Notification.permission==='granted';
  if(can){try{
      const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
      if(reg)await reg.showNotification(title,{body,tag:tag||title,icon:'icon-192.png',badge:'icon-192.png'});
      else new Notification(title,{body,tag:tag||title,icon:'icon-192.png'});
    }catch(e){}}
  if(!document.hidden||!can)toast(`<b>${esc(title)}</b><br>${esc(body)}`,7000);
}
function checkReminders(){
  if(!S.settings.notify)return;
  const n=now(),before=(S.settings.before||15)*60000;let ch=false;
  tasks().filter(t=>t.status==='todo'&&t.date&&t.time).forEach(t=>{
    const at=new Date(`${t.date}T${t.time}`).getTime(),k=`${t.id}|${t.date}|${t.time}`;
    if(S.notified[k])return;
    if(at-n<=before&&at-n>-10*60000){S.notified[k]=n;ch=true;
      const m=Math.round((at-n)/60000);notify(`⏰ ${t.title}`,m>0?`Começa em ${m} min (${t.time})`:`Agora (${t.time})`,k);}
  });
  for(const k in S.notified)if(n-S.notified[k]>30*864e5){delete S.notified[k];ch=true;}
  if(ch)save();
}
setInterval(checkReminders,30000);

/* ---------- TEMPORIZADOR ---------- */
let tick=null;
function curTask(){return S.timer?S.tasks.find(x=>x.id===S.timer.taskId):null}
function startTimer(t,five){S.timer={taskId:t.id,startedAt:now(),endAt:now()+(five?5:t.estimate)*60000,paused:null,ended:false,five:!!five};save();showTimer();}
function showTimer(){
  const T=S.timer;if(!T)return;const t=curTask();if(!t){S.timer=null;save();return;}
  const a=area(t.areaId);$('#tArea').textContent=(T.five?'⚡ Só 5 minutos · ':'')+a.emoji+' '+a.name;$('#tTitle').textContent=t.title;
  $('#timer').classList.add('on');drawTimerCk();clearInterval(tick);tick=setInterval(upd,500);upd();
}
function drawTimerCk(){
  const t=curTask();if(!t)return;const L=t.checklist||[];
  if(!L.length){$('#tCk').innerHTML='';return;}
  const n=L.filter(i=>i.done).length,all=n===L.length;
  $('#tCk').innerHTML=`<div class="row"><b>☑️ Checklist</b><span class="sp"></span><span class="mut">${n}/${L.length}</span></div>

$('#tCk').addEventListener('change',e=>{const id=e.target.dataset.tci;if(!id)return;const t=curTask(),it=t.checklist.find(i=>i.id===id);
  it.done=e.target.checked;touch(t);save();drawTimerCk();});
$('#tCk').addEventListener('keydown',e=>{if(e.target.id!=='tNew'||e.key!=='Enter')return;e.preventDefault();const v=e.target.value.trim();if(!v)return;
  const t=curTask();t.checklist.push({id:uid(),text:v,done:false});touch(t);save();drawTimerCk();$('#tNew').focus();});
function spentMin(){const T=S.timer;const ms=T.paused!=null?(T.endAt-T.startedAt)-T.paused:Math.min(now(),T.endAt)-T.startedAt;return Math.max(1,ms/60000);}
function upd(){
  const T=S.timer;if(!T)return;const t=curTask();
  const rem=T.paused!=null?T.paused:Math.max(0,T.endAt-now());
  const total=T.endAt-T.startedAt||1,prog=Math.min(1,1-rem/total);
  $('#tClock').textContent=`${p2(Math.floor(rem/60000))}:${p2(Math.floor(rem%60000/1000))}`;
  $('#tPlant').textContent=prog<.33?'🌱':prog<.66?'🌿':'🪴';$('#tPlant').style.transform=`scale(${1+prog*1.5})`;
  const tt=tierFor(spentMin(),true);$('#tTier').textContent=`Recompensa atual: ${TIER[tt].ic} ${TIER[tt].n}`;
  $('#tPause').textContent=T.paused!=null?'▶ Retomar':'⏸ Pausar';
  if(rem<=0&&T.paused==null&&!T.ended){T.ended=true;save();beep();
    if(document.hidden)notify(T.five?'⚡ 5 minutos feitos!':'⏰ Tempo esgotado!',t?t.title:'','timer');}
  const left=t?Math.max(1,Math.round(t.estimate-spentMin())):0;
  $('#tEndMsg').innerHTML=T.five?'<b>⚡ 5 minutos feitos!</b> O mais difícil — começar — você já fez. Quer continuar?':'<b>⏰ Tempo estimado acabou!</b> E aí?';
  $('#tCont').style.display=T.five&&t&&t.estimate>5?'':'none';$('#tCont').textContent=`▶ Continuar (mais ${left} min)`;
  $('#tEnd').style.display=T.ended?'block':'none';
  document.title=(T.ended?'⏰ ':'⏱ ')+$('#tClock').textContent+' – Jardim';
}
function beep(){try{const c=new AudioContext();[0,.35,.7].forEach(d=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.3);o.start(c.currentTime+d);o.stop(c.currentTime+d+.3);});}catch(e){}}
function closeTimer(){clearInterval(tick);S.timer=null;save();$('#timer').classList.remove('on');document.title='Meu Jardim Planner';render();}
function addMore(min){const T=S.timer;T.endAt=now()+min*60000;T.ended=false;save();upd();}
$('#tPause').onclick=()=>{const T=S.timer;if(T.paused!=null){T.endAt=now()+T.paused;T.paused=null;}else{T.paused=Math.max(0,T.endAt-now());}save();upd();};

$('#tStop').onclick=()=>{const t=curTask(),m=spentMin();t.spent=(t.spent||0)+m;touch(t);closeTimer();
  toast(`🌱 ${Math.round(m)} min registrados em “${esc(t.title)}”. Começar já foi uma vitória!`,5000);};
const finish=()=>{const t=curTask();

  const m=spentMin();clearInterval(tick);S.timer=null;$('#timer').classList.remove('on');document.title='Meu Jardim Planner';completeTask(t,m,true);};
$('#tFinish').onclick=finish;$('#tDone').onclick=finish;

function grantReward(t,minutes,viaTimer){
  t.status='done';t.doneAt=now();t.spent=(t.spent||0)+minutes;t.inbox=false;touch(t);
  const tier=tierFor(minutes,viaTimer),item=drawItem(tier),isNew=!S.plants.some(p=>p.itemId===item.id);
  S.plants.push({id:uid(),itemId:item.id,emoji:item.e.startsWith('@')?'🌱':item.e,tier,taskId:t.id,taskTitle:t.title,areaId:t.areaId,minutes:Math.round(minutes),earnedAt:now(),updatedAt:now(),pos:null});
  const nd=spawnNext(t);save();return{item,tier,isNew,nd};
}
function showReward(item,tier,title,extra,isNew){
  if(isNew===undefined)isNew=S.plants.filter(p=>p.itemId===item.id).length===1;

  $('#mbox').innerHTML=`<div style="text-align:center"><div style="font-size:96px;margin:20px 0 10px">${itemHTML(item)}</div>

function completeTask(t,minutes,viaTimer){

    (missed?'<p class="mut">💡 Tarefas acima de 1h feitas pelo temporizador rendem itens Lendários.</p>':'')+(g.nd?`<p class="mut">🔁 Próxima repetição criada para ${fmtDate(g.nd)}.</p>`:''),g.isNew);
}

      <div><label>Forma de pagamento</label><select name="method" style="width:100%">${METHODS.map(m=>`<option ${m===x.method?'selected':''}>${m}</option>`).join('')}</select></div>
    </div>

  openModal();draw();

function editCats(){

/* ---------- BACKUP ---------- */
const b64=buf=>{let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function exportBk(pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const data={areas:S.areas,tasks:S.tasks,plants:S.plants,garden:S.garden,fin:S.fin,reviews:S.reviews,exportedAt:now()};
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await keyFrom(pw,salt),new TextEncoder().encode(JSON.stringify(data)));
  const blob=new Blob([JSON.stringify({app:'jardim-planner',v:5,salt:b64(salt),iv:b64(iv),data:b64(ct)})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`jardim-backup-${todayS()}-${p2(new Date().getHours())}${p2(new Date().getMinutes())}.jardim`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  S.lastExport=now();save();
}
function mergeList(local,inc){
  const map=new Map(local.map(x=>[x.id,x]));let add=0,upd=0,same=0;
  for(const x of inc||[]){const l=map.get(x.id);
    if(!l){map.set(x.id,x);add++;}
    else if((x.updatedAt||0)>(l.updatedAt||0)){map.set(x.id,x);upd++;}
    else same++;}
  return {list:[...map.values()],add,upd,same};
}
async function importBk(file,pw){
  const j=JSON.parse(await file.text());if(j.app!=='jardim-planner')throw new Error('Este arquivo não é um backup do Jardim Planner.');
  let data;try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},await keyFrom(pw,unb64(j.salt)),unb64(j.data));data=JSON.parse(new TextDecoder().decode(pt));}
  catch(e){throw new Error('Senha incorreta ou arquivo danificado.');}
  if(S.resetAt&&(data.exportedAt||0)<S.resetAt&&!confirm('⚠️ Este backup foi feito ANTES de você zerar o app. Importá-lo vai trazer de volta as tarefas e itens de teste. Importar mesmo assim?'))throw new Error('Importação cancelada.');
  (data.plants||[]).forEach(p=>{if(!p.updatedAt)p.updatedAt=p.earnedAt;if(p.pos===undefined)p.pos=null;if(!p.tier)p.tier='c';});
  (data.tasks||[]).forEach(t=>{t.recur=t.recur||{type:'none',n:2,days:[]};if(t.parentId===undefined)t.parentId=null;t.checklist=t.checklist||[];t.props=t.props||{};});
  const A=mergeList(S.areas,data.areas),T=mergeList(S.tasks,data.tasks),P=mergeList(S.plants,data.plants);
  S.areas=A.list;S.tasks=T.list;S.plants=P.list;
  let F=null;
  if(data.fin){const C=mergeList(S.fin.cats,data.fin.cats),X=mergeList(S.fin.tx,data.fin.tx);S.fin.cats=C.list;S.fin.tx=X.list;F=X;}
  if(data.reviews)S.reviews=[...new Set([...S.reviews,...data.reviews])];
  const used=new Set();S.plants.filter(p=>p.pos).sort((a,b)=>a.updatedAt-b.updatedAt).forEach(p=>{const k=p.pos.r+','+p.pos.c;if(used.has(k))p.pos=null;else used.add(k);});
  if(data.garden&&data.garden.size>S.garden.size)S.garden.size=data.garden.size;
  save();
  return `🌱 Itens do jardim: ${P.add} novos · ${P.upd} com posição atualizada · ${P.same} sem mudança (nenhum duplicado, nenhum perdido)<br>📋 Tarefas: ${T.add} novas · ${T.upd} atualizadas · ${T.same} sem mudança<br>🗂️ Áreas: ${A.add} novas · ${A.upd} atualizadas${F?`<br>💰 Lançamentos: ${F.add} novos · ${F.upd} atualizados · ${F.same} sem mudança`:''}`;
}

  <p class="mut">A importação <b>mescla</b> os dados: nenhum item do jardim é apagado ou duplicado. Para tarefas, áreas, lançamentos e posições no jardim, vale a versão alterada por último.</p>
  <div class="row"><input type="file" id="fi" accept=".jardim,application/json"><input type="password" id="pw3" placeholder="Senha do backup"><button class="b" id="im" type="button">Importar</button></div>
  <p id="m2" aria-live="polite"></p></div>
  <div class="card"><h2 style="margin-top:0">📱 Sobre este aparelho</h2>
   <p class="mut">${isStandalone()?'✅ Rodando como app instalado.':isFile?'💻 Rodando pelo arquivo local no PC.':'🌐 Rodando no navegador. Instale pelo menu do navegador (“Instalar app” ou “Adicionar à tela inicial”).'} ${S.resetAt?'· Último reset: '+new Date(S.resetAt).toLocaleString('pt-BR'):''}</p></div>
  <div class="card" style="border:1px solid var(--red)"><h2 style="margin-top:0;color:var(--red)">🧹 Zerar o aplicativo</h2>
   <p class="mut">Apaga os dados <b>deste aparelho</b>. Faça um backup antes, por segurança.</p>
   <button class="d" id="rst" type="button">Zerar aplicativo…</button></div>`;
  $('#nOn').onclick=async()=>{
    if(S.settings.notify){S.settings.notify=false;save();render();return;}
    if(!hasN){toast('Este navegador não suporta notificações. Os avisos aparecerão dentro do app.');S.settings.notify=true;save();render();return;}
    let p=Notification.permission;if(p==='default'){try{p=await Notification.requestPermission();}catch(e){}}
    S.settings.notify=true;save();render();
    toast(p==='granted'?'🔔 Lembretes ativados!':'🔔 Ativados apenas dentro do app (o navegador não liberou notificações do sistema).',5000);};
  $('#nBefore').onchange=e=>{S.settings.before=+e.target.value;save();};
  $('#nTest').onclick=()=>{if(!S.settings.notify){toast('Ative os lembretes primeiro.');return;}notify('🌱 Teste de lembrete','Os lembretes estão funcionando!','teste');};
  $('#ex').onclick=async()=>{const a=$('#pw1').value,b=$('#pw2').value;
    if(a.length<8)return $('#m1').textContent='A senha precisa ter pelo menos 8 caracteres.';if(a!==b)return $('#m1').textContent='As senhas não conferem.';
    try{await exportBk(a);$('#m1').textContent='✅ Backup gerado! Guarde o arquivo em local seguro (ex.: OneDrive).';}catch(e){$('#m1').textContent='Erro: '+e.message;}};
  $('#im').onclick=async()=>{const f=$('#fi').files[0];if(!f)return $('#m2').textContent='Escolha um arquivo.';
    try{$('#m2').innerHTML='✅ Importado!<br>'+await importBk(f,$('#pw3').value);}catch(e){$('#m2').textContent='⚠️ '+e.message;}};
  $('#rst').onclick=resetFlow;
}
function resetFlow(){
  $('#mbox').innerHTML=`<h2 style="margin-top:0;color:var(--red)">🧹 Zerar o aplicativo</h2>
   <label style="color:var(--txt);font-size:15px"><input type="radio" name="rm" value="keep" checked> <b>Começar do zero, mantendo minhas configurações</b><br><span class="mut" style="margin-left:24px">Apaga tarefas, jardim, coleção, estatísticas e lançamentos. Mantém áreas (com propriedades), categorias financeiras e lembretes.</span></label>
   <label style="color:var(--txt);font-size:15px;margin-top:10px"><input type="radio" name="rm" value="all"> <b>Apagar absolutamente tudo</b><br><span class="mut" style="margin-left:24px">Volta ao app como na primeira vez que você abriu.</span></label>
   <p>Para confirmar, digite <b>ZERAR</b>:</p><input id="rc" autocomplete="off" style="width:100%">
   <p class="mut" id="err" aria-live="polite" style="color:var(--red)"></p>
   <div class="row"><span class="sp"></span><button class="g" id="cx" type="button">Cancelar</button><button class="d" id="go" type="button">Zerar</button></div>`;
  openModal();$('#cx').onclick=closeModal;
  $('#go').onclick=()=>{
    if($('#rc').value.trim().toUpperCase()!=='ZERAR'){$('#err').textContent='Digite ZERAR para confirmar.';return;}
    const mode=document.querySelector('[name=rm]:checked').value;
    if(mode==='all'){S=migrate(defaults());}
    else{S.tasks=[];S.plants=[];S.fin.tx=[];S.timer=null;S.reviews=[];S.notified={};S.garden={size:S.garden.size||10};S.lastExport=null;}
    S.resetAt=now();save();closeModal();gMode='garden';go('today');toast('🧹 Pronto! App zerado. Bom começo! 🌱',5000);};
}

/* ---------- PWA (instalação e uso offline) ---------- */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}

render();
if(S.timer)showTimer();
checkReminders();
})();
</script>
</body>
</html>
